name: Backend CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Code Compilation (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Compile Code
        run: ./mvnw clean compile

  test:
    name: Automated Tests (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unimart
          MYSQL_ROOT_PASSWORD: Varna
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Create env.properties config file
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/env.properties
          DB_URL=jdbc:mysql://127.0.0.1:3306/unimart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME=root
          DB_PASSWORD=Varna
          SERVER_PORT=8080
          SPRING_PROFILES_ACTIVE=local
          APP_ALLOWED_ORIGINS=http://localhost:5173
          JWT_SECRET=RTY0ZDRjOGU0NDcwOGRhODQxZWI4ZTk3YjNlODIyNjQ4MmRkY2M5YTkyNjg3NmI4ZDlkYWI4Zjc4MjBlZWE5Yw==
          JWT_ACCESS_MINUTES=15
          EOF

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Test Suite
        run: ./mvnw clean test

  report:
    name: CI Summary & PR Comment
    needs: [compile, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render GitHub Job Summary
        run: |
          COMPILE_STATUS="${{ needs.compile.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          TEST_STATUS="${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          OVERALL_STATUS="${{ (needs.compile.result == 'success' && needs.test.result == 'success') && '✅ Passed' || '❌ Failed' }}"

          echo "### 🚀 UniMart Backend CI Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result | Command |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Compilation** | ${COMPILE_STATUS} | \`./mvnw clean compile\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Automated Tests** | ${TEST_STATUS} | \`./mvnw clean test\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Pipeline Status:** **${OVERALL_STATUS}**" >> $GITHUB_STEP_SUMMARY

      - name: Post or Update PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const compileStatus = '${{ needs.compile.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const testStatus = '${{ needs.test.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const isSuccess =
              '${{ needs.compile.result }}' === 'success' &&
              '${{ needs.test.result }}' === 'success';
            const overallStatus = isSuccess ? '✅ Passed' : '❌ Failed';

            const { owner, repo, number } = context.issue;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const botComment = comments.find(c => c.body && c.body.includes('### 🚀 UniMart Backend CI Status Report'));
            const actionText = botComment ? 'Updated' : 'Created';

            const commentBody = `### 🚀 UniMart Backend CI Status Report

            | Check | Result | Command |
            | :--- | :---: | :--- |
            | **Code Compilation** | ${compileStatus} | \`./mvnw clean compile\` |
            | **Automated Tests** | ${testStatus} | \`./mvnw clean test\` |

            **Overall Pipeline Status:** **${overallStatus}**
            *Comment ${actionText} | Commit: \`${context.sha.substring(0, 7)}\` | Workflow Run: [#${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})*`;

            if (botComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: botComment.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: commentBody });
            }
